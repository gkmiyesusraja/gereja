<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | GKMI Yesus Raja</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Theme style AdminLTE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  <style>
    body.login-page {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      height: 100vh;
    }
    .login-card-body {
      border-radius: 10px;
    }
    .card-primary.card-outline {
      border-top: 3px solid #007bff;
    }
  </style>
</head>
<body class="hold-transition login-page align-items-center justify-content-center">

<div class="login-box" style="width: 380px;">
  <div class="login-logo mb-3">
    <a href="login.html" class="text-white font-weight-bold" style="text-shadow: 0 2px 4px rgba(0,0,0,0.3);">
      <i class="fas fa-church mr-2"></i><b>GKMI</b> Yesus Raja
    </a>
  </div>
  
  <div class="card card-outline card-primary shadow-lg border-0 rounded-lg">
    <div class="card-header text-center bg-white py-3 border-bottom-0">
      <h5 class="font-weight-bold text-dark m-0">Masuk ke Sistem</h5>
      <small class="text-muted">Jadwal Pelayanan Musik Gereja</small>
    </div>
    
    <div class="card-body login-card-body pt-1">
      <form id="formLogin" action="#" method="post">
        <div class="input-group mb-3">
          <input type="text" id="username" class="form-control" placeholder="Username" required autofocus autocomplete="off">
          <div class="input-group-append">
            <div class="input-group-text bg-white">
              <span class="fas fa-user text-primary"></span>
            </div>
          </div>
        </div>
        
        <div class="input-group mb-3">
          <input type="password" id="password" class="form-control" placeholder="Password" required>
          <div class="input-group-append">
            <div class="input-group-text bg-white">
              <span class="fas fa-lock text-primary"></span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block font-weight-bold py-2">
              <i class="fas fa-sign-in-alt mr-1"></i> Masuk Sekarang
            </button>
          </div>
        </div>
      </form>

      <div class="mt-4 p-2 bg-light rounded border text-muted small">
        <strong class="text-dark d-block mb-1"><i class="fas fa-info-circle text-info mr-1"></i> Akun Bawaan Testing:</strong>
        <div class="d-flex justify-content-between"><span>• Dev:</span> <code>dev</code> / <code>dev123</code></div>
        <div class="d-flex justify-content-between"><span>• Admin:</span> <code>admin</code> / <code>admin123</code></div>
        <div class="d-flex justify-content-between"><span>• User:</span> <code>user1</code> / <code>user123</code></div>
      </div>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  const USERS_KEY = 'church_users_v1';
  const CURRENT_USER_KEY = 'church_current_user';

  const DEFAULT_USERS = [
    { username: 'dev', password: 'dev123', nama: 'Pengembang (Dev)', role: 'dev' },
    { username: 'admin', password: 'admin123', nama: 'Admin Utama', role: 'admin' },
    { username: 'user1', password: 'user123', nama: 'Petugas User 1', role: 'user' }
  ];

  function getUsers() {
    const raw = localStorage.getItem(USERS_KEY);
    return raw ? JSON.parse(raw) : DEFAULT_USERS;
  }

  $(document).ready(function() {
    // If already logged in, redirect to index.html
    const currentUser = localStorage.getItem(CURRENT_USER_KEY);
    if (currentUser) {
      window.location.href = 'index.html';
      return;
    }

    $('#formLogin').on('submit', function(e) {
      e.preventDefault();
      const u = $('#username').val().trim();
      const p = $('#password').val().trim();

      const users = getUsers();
      const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);

      if (found) {
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(found));
        Swal.fire({
          icon: 'success',
          title: 'Login Berhasil!',
          text: `Selamat datang kembali, ${found.nama}`,
          timer: 1200,
          showConfirmButton: false
        }).then(() => {
          window.location.href = 'index.html';
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Login Gagal',
          text: 'Username atau Password yang Anda masukkan salah.'
        });
      }
    });
  });
</script>
</body>
</html>
