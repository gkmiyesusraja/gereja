<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah User Baru | GKMI Yesus Raja</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- AdminLTE Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  <style>
    body { font-family: 'Source Sans Pro', sans-serif; }
    .card-title { font-size: 1.15rem; }
    .back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1050;
      display: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      text-align: center;
      line-height: 42px;
      padding: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed layout-navbar-fixed">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
    </ul>

    <!-- Right navbar links -->
    <ul class="navbar-nav ml-auto" id="userNavSection">
    </ul>
  </nav>

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="index.html" class="brand-link">
      <i class="fas fa-church brand-image img-circle elevation-3 p-2 bg-primary text-white" style="opacity: .8"></i>
      <span class="brand-text font-weight-light">GKMI Yesus Raja</span>
    </a>

    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-header">MENU UTAMA</li>
          <li class="nav-item">
            <a href="index.html" class="nav-link">
              <i class="nav-icon fas fa-calendar-alt"></i>
              <p>Jadwal Musik</p>
            </a>
          </li>
          <li class="nav-item" id="navDataJemaat">
            <a href="jemaat.html" class="nav-link">
              <i class="nav-icon fas fa-user-friends"></i>
              <p>Data Jemaat</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="users.html" class="nav-link active">
              <i class="nav-icon fas fa-users-cog"></i>
              <p>Kelola User</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <section class="content pt-3">
      <div class="container-fluid">

        <!-- Form Card -->
        <div class="card card-primary card-outline">
          <div class="card-header">
            <h3 class="card-title" id="formTitle"><i class="fas fa-user-plus mr-2"></i>Tambah User Baru</h3>
          </div>

          <form id="formUser" action="#" method="post">
            <div class="card-body">
              <div class="row">
                <div class="col-md-6 form-group">
                  <label for="username">Username <span class="text-danger">*</span></label>
                  <input type="text" id="username" class="form-control" placeholder="cth: pelayan1" required autocomplete="off">
                  <div class="invalid-feedback" id="err-username">Username wajib diisi!</div>
                </div>

                <div class="col-md-6 form-group">
                  <label for="password">Password <span class="text-danger">*</span></label>
                  <input type="password" id="password" class="form-control" placeholder="Ketik password" required>
                  <div class="invalid-feedback" id="err-password">Password wajib diisi!</div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 form-group">
                  <label for="nama">Nama Lengkap <span class="text-danger">*</span></label>
                  <input type="text" id="nama" class="form-control" placeholder="cth: Yohanes Budi" required>
                  <div class="invalid-feedback" id="err-nama">Nama lengkap wajib diisi!</div>
                </div>

                <div class="col-md-6 form-group">
                  <label for="role">Role / Hak Akses <span class="text-danger">*</span></label>
                  <select id="role" class="form-control" required>
                    <!-- Options rendered dynamically based on current user role -->
                  </select>
                </div>
              </div>
            </div>

            <div class="card-footer">
              <a href="users.html" class="btn btn-secondary btn-sm" data-toggle="tooltip" title="Kembali ke Daftar User">
                <i class="fas fa-arrow-left"></i>
              </a>
              <button type="submit" class="btn btn-primary float-right" data-toggle="tooltip" title="Simpan Data User">
                <i class="fas fa-save"></i>
              </button>
            </div>
          </form>
        </div>

      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="float-right d-none d-sm-inline">
      Aplikasi Pelayanan Musik
    </div>
    <strong>GKMI Yesus Raja &copy; 2026</strong>. All rights reserved.
  </footer>

  <!-- Back to Top Button -->
  <a id="btnBackToTop" href="#" class="btn btn-primary back-to-top" role="button" data-toggle="tooltip" title="Kembali ke Atas">
    <i class="fas fa-chevron-up"></i>
  </a>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  const USERS_KEY = 'church_users_v1';
  const CURRENT_USER_KEY = 'church_current_user';
  const GAS_URL_KEY = 'church_gas_web_app_url';

  const DEFAULT_USERS = [
    { username: 'dev', password: 'dev123', nama: 'Pengembang (Dev)', role: 'dev' },
    { username: 'admin', password: 'admin123', nama: 'Admin Utama', role: 'admin' },
    { username: 'user1', password: 'user123', nama: 'Petugas User 1', role: 'user' }
  ];

  const Toast = Swal.mixin({
    toast: true,
    position: 'top-end',
    showConfirmButton: false,
    timer: 2000,
    timerProgressBar: true
  });

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function getUsers() {
    const raw = localStorage.getItem(USERS_KEY);
    return raw ? JSON.parse(raw) : DEFAULT_USERS;
  }

  function saveUsers(users) {
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
  }

  function getCurrentUser() {
    const raw = localStorage.getItem(CURRENT_USER_KEY);
    return raw ? JSON.parse(raw) : null;
  }

  function renderUserNav() {
    const user = getCurrentUser();
    const nav = $('#userNavSection');
    nav.empty();

    if (user) {
      nav.append(`
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-dark font-weight-normal" data-toggle="dropdown" href="#" role="button">
            <i class="fas fa-user-circle mr-1 text-primary"></i> <strong>${escapeHtml(user.nama)}</strong> <span class="badge badge-secondary ml-1">${user.role.toUpperCase()}</span>
          </a>
          <div class="dropdown-menu dropdown-menu-right">
            <div class="dropdown-item disabled text-muted small py-1"><i class="fas fa-id-badge mr-1"></i> ${escapeHtml(user.username)}</div>
            <div class="dropdown-divider"></div>
            <a href="javascript:void(0)" onclick="logoutUser()" class="dropdown-item text-danger py-1"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
          </div>
        </li>
      `);
    }
  }

  function logoutUser() {
    localStorage.removeItem(CURRENT_USER_KEY);
    window.location.href = 'login.html';
  }

  $(document).ready(function() {
    const currentUser = getCurrentUser();
    if (!currentUser || (currentUser.role !== 'dev' && currentUser.role !== 'admin')) {
      alert('Akses ditolak. Halaman ini hanya untuk Admin & Dev.');
      window.location.href = 'index.html';
      return;
    }

    renderUserNav();

    // Populate role options according to permissions
    const roleSelect = $('#role');
    roleSelect.empty();
    if (currentUser.role === 'dev') {
      roleSelect.append(`
        <option value="user">User Biasa</option>
        <option value="admin">Admin</option>
        <option value="dev">Developer</option>
      `);
    } else {
      roleSelect.append(`
        <option value="user">User Biasa</option>
      `);
    }

    // Tooltips
    $('.tooltip').remove();
    $('[data-toggle="tooltip"]').tooltip({ trigger: 'hover' });

    $(document).on('click mouseleave', '[data-toggle="tooltip"]', function() {
      $(this).tooltip('hide');
      $('.tooltip').remove();
    });

    // Form Submit
    $('#formUser').on('submit', function(e) {
      e.preventDefault();
      $('.form-control').removeClass('is-invalid');

      const u = $('#username').val().trim();
      const p = $('#password').val().trim();
      const n = $('#nama').val().trim();
      const r = $('#role').val();

      let isValid = true;
      if (!u) { $('#username').addClass('is-invalid'); isValid = false; }
      if (!p) { $('#password').addClass('is-invalid'); isValid = false; }
      if (!n) { $('#nama').addClass('is-invalid'); isValid = false; }

      if (!isValid) return false;

      const users = getUsers();
      if (users.some(x => x.username.toLowerCase() === u.toLowerCase())) {
        $('#username').addClass('is-invalid');
        Toast.fire({ icon: 'error', title: 'Username sudah digunakan!' });
        return false;
      }

      const newUser = { username: u, password: p, nama: n, role: r };
      users.push(newUser);
      saveUsers(users);

      // Sync to Google Sheet
      const gasUrl = localStorage.getItem(GAS_URL_KEY);
      if (gasUrl) {
        try {
          fetch(gasUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'saveUser', data: newUser })
          });
        } catch(err) {}
      }

      Toast.fire({ icon: 'success', title: 'User baru berhasil disimpan!' });
      setTimeout(() => window.location.href = 'users.html', 1200);
    });

    $(window).scroll(function() {
      if ($(this).scrollTop() > 150) {
        $('#btnBackToTop').fadeIn();
      } else {
        $('#btnBackToTop').fadeOut();
      }
    });

    $('#btnBackToTop').click(function(e) {
      e.preventDefault();
      $('html, body').animate({ scrollTop: 0 }, 'fast');
    });
  });
</script>
</body>
</html>
